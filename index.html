<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professor — Idiomas com Inteligência Artificial</title>
    <meta name="description" content="Um professor particular de idiomas baseado em inteligência artificial, focado em uma experiência de estudo minimalista, elegante e altamente eficiente." />
    <meta property="og:title" content="Professor — Idiomas com Inteligência Artificial" />
    <meta property="og:description" content="Um professor particular de idiomas baseado em inteligência artificial, focado em uma experiência de estudo minimalista, elegante e altamente eficiente." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans (UI) & Lora (Serif Display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              serif: ['Lora', 'serif'],
            }
          }
        }
      }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Scrollbar and Base Style Styles -->
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #FAFAFA;
        color: #111111;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      /* Custom focus styles */
      input:focus, textarea:focus, select:focus {
        border-color: #111111 !important;
        outline: none;
      }
    </style>
  </head>
  <body class="overflow-hidden h-screen w-screen flex flex-col md:flex-row">
    
    <!-- Dynamic Target Container for App -->
    <div id="app" class="w-full h-full flex flex-col md:flex-row"></div>

    <!-- Gemini API Key Configuration Modal -->
    <div id="api-key-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
      <div class="bg-white border border-[#EDEDED] rounded-2xl w-full max-w-md p-6 md:p-8 shadow-lg text-left animate-in zoom-in-95 duration-200">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-base font-bold text-neutral-950 flex items-center gap-2">
            <i data-lucide="key" class="w-4 h-4 text-neutral-900"></i>
            Configurar Chave API
          </h3>
          <button onclick="closeApiKeyModal()" class="text-neutral-400 hover:text-neutral-900 p-1 rounded-full hover:bg-neutral-100 transition-all cursor-pointer">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <p class="text-xs text-neutral-600 mb-6 leading-relaxed">
          Para utilizar o professor na nuvem, insira a sua chave pessoal do <strong>Gemini API Key</strong>. Ela será armazenada localmente apenas no seu navegador.
        </p>
        <div class="space-y-4">
          <div>
            <label class="block text-[10px] uppercase tracking-widest text-[#999999] mb-1.5 font-bold">
              Gemini API Key
            </label>
            <input 
              id="gemini-key-input" 
              type="password" 
              placeholder="Cole sua chave AIzaSy..." 
              class="w-full px-3 py-2.5 border border-neutral-200 rounded-lg text-xs"
            />
          </div>
          <div class="flex gap-2.5 pt-2">
            <button onclick="saveApiKey()" class="flex-1 py-2.5 px-4 bg-black text-white text-xs font-semibold rounded-lg hover:bg-neutral-800 transition-all cursor-pointer text-center">
              Salvar Chave
            </button>
            <button onclick="clearApiKey()" class="py-2.5 px-4 border border-neutral-200 text-neutral-600 text-xs font-semibold rounded-lg hover:bg-neutral-50 transition-all cursor-pointer text-center">
              Remover
            </button>
          </div>
          <p class="text-[10px] text-neutral-500 text-center">
            Não tem uma chave? <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-black font-semibold hover:underline">Obtenha gratuitamente no Google AI Studio</a>.
          </p>
        </div>
      </div>
    </div>

    <!-- Core App Logic -->
    <script src="script.js"></script>
  </body>
</html>
